client_id = "cc04d2b21de39debde846f2b0f70a763"
name = "Zeosync"
application_url = "https://zeosync.app/"
embedded = true

[build]
automatically_update_urls_on_dev = true

[access_scopes]
scopes = "read_products,write_products,read_orders,write_orders,read_inventory,write_inventory,read_locations,write_locations,read_returns"
optional_scopes = [
  "read_files",
  "write_files",
  "read_publications",
  "write_publications"
]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://zeosync.app/callback",
  "https://zeosync.app/"
]

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
uri = "https://zeosync.app/customers/data_request"
compliance_topics = ["customers/data_request"]

[[webhooks.subscriptions]]
uri = "https://zeosync.app/customers/redact"
compliance_topics = ["customers/redact"]

[[webhooks.subscriptions]]
uri = "https://zeosync.app/shop/redact"
compliance_topics = ["shop/redact"]

[[webhooks.subscriptions]]
uri = "https://zeosync.app/webhooks/app-uninstalled"
topics = ["app/uninstalled"]

[[webhooks.subscriptions]]
uri = "https://zeosync.app/webhooks/shopify/orders/create"
topics = ["orders/create"]

[[webhooks.subscriptions]]
uri = "https://zeosync.app/webhooks/shopify/orders/update"
topics = ["orders/updated"]

[[webhooks.subscriptions]]
uri = "https://zeosync.app/webhooks/shopify/orders/delete"
topics = ["orders/delete"]

[[webhooks.subscriptions]]
uri = "https://zeosync.app/webhooks/shopify/returns/create"
topics = ["returns/request"]

[[webhooks.subscriptions]]
uri = "https://zeosync.app/webhooks/shopify/returns/update"
topics = ["returns/update"]

[[webhooks.subscriptions]]
uri = "https://zeosync.app/webhooks/shopify/products/create"
topics = ["products/create"]

[[webhooks.subscriptions]]
uri = "https://zeosync.app/webhooks/shopify/products/update"
topics = ["products/update"]

[[webhooks.subscriptions]]
uri = "https://zeosync.app/webhooks/shopify/products/delete"
topics = ["products/delete"]

[[webhooks.subscriptions]]
uri = "https://zeosync.app/webhooks/shopify/inventory_levels/update"
topics = ["inventory_levels/update"]