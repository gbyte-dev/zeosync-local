name = "Zeosync"
client_id = "cc04d2b21de39debde846f2b0f70a763"
application_url = "https://zeosync.app/"
embedded = true

[build]
automatically_update_urls_on_dev = true

[access_scopes]
# The permissions your app needs
scopes = "read_products,write_orders"

[auth]
# This tells Shopify where to send the user to start the session
redirect_urls = [
  "https://zeosync.app/callback",
  "https://zeosync.app/"
]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://zeosync.app/webhooks/app-uninstalled"


[[webhooks.subscriptions]]
topics = ["orders/create"]
uri = "https://zeosync.app/webhooks/shopify/orders/create"


[[webhooks.subscriptions]]
compliance_topics = [
  "customers/data_request",
  "customers/redact",
  "shop/redact"
]
uri = "https://zeosync.app/webhooks/compliance"